name: EMA Hourly Continuation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode (placeholder for later research logic)"
        required: false
        default: "default"
        type: string
      note:
        description: "Optional free-text note for this run"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ema-hourly-continuation
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show run context
        shell: bash
        run: |
          echo "## EMA Hourly Continuation — run context" >> "$GITHUB_STEP_SUMMARY"
          echo "- Event: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: ${{ inputs.mode || 'default' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Note: ${{ inputs.note || '(none)' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ref: ${{ github.ref }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Workflow scaffold is live. Replace this job with research steps when ready."

      - name: Placeholder research step
        shell: bash
        run: |
          echo "Placeholder step — update this workflow with EMA hourly continuation research logic."
          echo "Inputs available: mode='${{ inputs.mode }}', note='${{ inputs.note }}'"
