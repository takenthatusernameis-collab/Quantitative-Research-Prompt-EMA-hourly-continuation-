name: Kilo General Agent Loop

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/main.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      agents:
        description: "Maximum sequential Kilo worker sessions for this activation"
        required: false
        default: "1000"
        type: number
      diagnostics_only:
        description: "Collect and verify completed-run diagnostics without starting Kilo"
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

concurrency:
  group: kilo-repository
  cancel-in-progress: false

jobs:
  kilo:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout latest default branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Placeholder until full breakout workflow is pasted
        shell: bash
        run: |
          echo "## EMA Hourly Continuation"
          echo "This is a temporary scaffold."
          echo "Paste the full content of:"
          echo "https://raw.githubusercontent.com/takenthatusernameis-collab/Quantitative-Breakout-Trading-Strategy-Research-/main/.github/workflows/main.yml"
          echo "into .github/workflows/main.yml (81KB — exceeds single tool write size)."
          echo "Event: ${{ github.event_name }}"
          echo "Agents input: ${{ inputs.agents || '1000' }}"
          echo "Diagnostics only: ${{ inputs.diagnostics_only || false }}"
